[workspace]
members = ["crates/stackforge-core", "crates/stackforge-automata"]
exclude = ["crates/stackforge-core/fuzz"]
resolver = "2"

[package]
name = "stackforge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "A high-performance, modular networking stack and automata framework."
repository = "https://github.com/LaBackDoor/stackforge"
homepage = "https://github.com/LaBackDoor/stackforge"
keywords = ["networking", "python", "automata", "rust"]
categories = ["network-programming", "science"]
publish = false

[package.metadata.release]
shared-version = true
tag-name = "v{{version}}"

[workspace.package]
version = "0.7.2"
edition = "2024"
license = "GPL-3.0-only"
authors = ["Stackforge Contributors"]
repository = "https://github.com/LaBackDoor/stackforge"

[workspace.dependencies]
bytes = "1.11.0"
smallvec = "1.15.1"
thiserror = "2.0.17"
dashmap = "6.1"
memmap2 = "0.9"
tempfile = "3"
stackforge-core = { path = "crates/stackforge-core" }
stackforge-automata = { path = "crates/stackforge-automata" }

[lib]
name = "stackforge"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.2", features = ["extension-module"] }
stackforge-core.workspace = true
stackforge-automata.workspace = true


[package.metadata.bin]
tre-command = { version = "0.4.0", bins = ["tre"] }

[workspace.lints.rust]
missing_docs = "allow"

# Optimized release profile: thin LTO for balance of speed and compile time
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Maximum optimization profile (for benchmarks and production)
[profile.release-max]
inherits = "release"
lto = "fat"
strip = true

# Bench profile inherits release for reliable measurements
[profile.bench]
lto = "thin"
codegen-units = 1

[lints]
workspace = true
