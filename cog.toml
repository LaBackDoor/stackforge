tag_prefix = "v"
ignore_merge_commits = true
skip_untracked = true
pre_bump_hooks = [
    "sed -i '' 's/^version = \"[0-9]*\\.[0-9]*\\.[0-9]*\"/version = \"{{version}}\"/' Cargo.toml",
    "sed -i '' 's/stackforge-core = { version = \"[0-9]*\\.[0-9]*\\.[0-9]*\"/stackforge-core = { version = \"{{version}}\"/' Cargo.toml",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
repository = "stackforge"
owner = "LaBackDoor"
